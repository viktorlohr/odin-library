<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h3>Currently Available Books</h3>
    <div class="books"></div>
    <h3>Add New Book</h3>
    <form class="add-book">
      <label for="title">Title:</label>
      <input type="text" id="title" name="title" minlength="3" />

      <label for="author">Author:</label>
      <input type="text" id="author" name="author" minlength="3" />

      <label for="page-count">Number of pages:</label>
      <input type="number" id="page-count" name="page-count" minlength="1" />

      <button type="submit">Add Book</button>
    </form>
  </body>
</html>
